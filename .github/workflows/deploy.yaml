name: Deploy Lambda to AWS

on:
  workflow_dispatch:

env:
  AWS_REGION: us-east-1
  JAVA_VERSION: "25"
  MAVEN_PROJECT_DIR: ./src/auth-lambda
  TERRAFORM_LAMBDA_SOURCE_DIR: ./src/auth-lambda/target/lambda-package
  TF_IN_AUTOMATION: true
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  build-and-deploy:
    name: Build and Deploy Lambda
    runs-on: ubuntu-latest

    permissions:
      contents: read

    steps:
      - name: Checkout do codigo
        uses: actions/checkout@v4

      - name: Configurar Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}
          cache: maven

      - name: Build da aplicacao Java
        working-directory: ${{ env.MAVEN_PROJECT_DIR }}
        run: mvn -B -ntp clean package

      - name: Preparar pacote da Lambda para Terraform
        working-directory: ${{ env.MAVEN_PROJECT_DIR }}
        run: |
          rm -rf ./target/lambda-package
          mkdir -p ./target/lambda-package/lib

          JAR_PATH=$(find ./target -maxdepth 1 -type f -name "*.jar" ! -name "*sources.jar" ! -name "*javadoc.jar" | head -n 1)

          if [ -z "$JAR_PATH" ]; then
            echo "Nenhum JAR encontrado em ./target"
            exit 1
          fi

          cp "$JAR_PATH" ./target/lambda-package/lib/auth-lambda.jar
          mvn -B -ntp dependency:copy-dependencies -DincludeScope=runtime -DoutputDirectory=./target/lambda-package/lib

      - name: Configurar credenciais AWS
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-session-token: ${{ secrets.AWS_SESSION_TOKEN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Validar secrets obrigatorios
        env:
          JWT_KEY_VALUE: ${{ secrets.JWT_KEY }}
          DB_PASSWORD_VALUE: ${{ secrets.DB_PASSWORD }}
        run: |
          set -euo pipefail
          if [ -z "${JWT_KEY_VALUE}" ]; then
            echo "Erro: secret JWT_KEY nao definido (ou vazio)."
            exit 1
          fi
          if [ -z "${DB_PASSWORD_VALUE}" ]; then
            echo "Erro: secret DB_PASSWORD nao definido (ou vazio)."
            exit 1
          fi

      - name: Configurar Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.10.0

      - name: Resolver configuracao de backend
        run: |
          echo "TF_STATE_BUCKET_EFFECTIVE=${{ vars.TF_STATE_BUCKET || secrets.TF_STATE_BUCKET || 'fiap-14soat-fase5-jonasfschuh' }}" >> "$GITHUB_ENV"
          echo "TF_STATE_KEY_EFFECTIVE=${{ vars.TF_STATE_KEY || secrets.TF_STATE_KEY || 'lambda-auth/terraform.tfstate' }}" >> "$GITHUB_ENV"

      - name: Garantir bucket de state
        run: |
          if aws s3api head-bucket --bucket "${TF_STATE_BUCKET_EFFECTIVE}" 2>/dev/null; then
            echo "Bucket de state ja existe."
          else
            aws s3api create-bucket --bucket "${TF_STATE_BUCKET_EFFECTIVE}" --region "${{ env.AWS_REGION }}"
          fi

          aws s3api put-bucket-versioning --bucket "${TF_STATE_BUCKET_EFFECTIVE}" --versioning-configuration Status=Enabled

      - name: Inicializar Terraform
        working-directory: ./terraform
        run: |
          terraform init -reconfigure \
            -backend-config="bucket=${TF_STATE_BUCKET_EFFECTIVE}" \
            -backend-config="key=${TF_STATE_KEY_EFFECTIVE}" \
            -backend-config="region=${{ env.AWS_REGION }}" \
            -backend-config="encrypt=true"

      - name: Validar Terraform
        working-directory: ./terraform
        run: terraform validate

      - name: Planejar Terraform
        working-directory: ./terraform
        env:
          TF_VAR_aws_region: ${{ env.AWS_REGION }}
          TF_VAR_lambda_runtime: ${{ vars.LAMBDA_RUNTIME || 'java21' }}
          TF_VAR_enable_lambda_authorizer: ${{ vars.ENABLE_LAMBDA_AUTHORIZER || 'true' }}
          TF_VAR_jwt_key: ${{ secrets.JWT_KEY }}
          TF_VAR_jwt_issuer: ${{ vars.JWT_ISSUER || secrets.JWT_ISSUER || 'RaceforceApi' }}
          TF_VAR_infra_terraform_state_bucket: ${{ env.TF_STATE_BUCKET_EFFECTIVE }}
          TF_VAR_banco_terraform_state_bucket: ${{ env.TF_STATE_BUCKET_EFFECTIVE }}
          TF_VAR_customer_db_state_key: ${{ vars.CUSTOMER_DB_STATE_KEY || 'customer/database/terraform.tfstate' }}
          TF_VAR_db_password: ${{ secrets.DB_PASSWORD }}
          TF_VAR_new_relic_account_id: ${{ secrets.NEW_RELIC_ACCOUNT_ID }}
          TF_VAR_new_relic_license_key: ${{ secrets.NEW_RELIC_KEY }}
        run: terraform plan -input=false -out=tfplan

      - name: Aplicar Terraform
        working-directory: ./terraform
        run: terraform apply -input=false -auto-approve tfplan

      - name: Publicar endpoint oficial no summary
        if: always()
        working-directory: ./terraform
        run: |
          OFFICIAL_ENDPOINT=""
          OFFICIAL_ENDPOINT=$(terraform output -raw api_gateway_official_endpoint 2>/dev/null || true)
          if [ -z "${OFFICIAL_ENDPOINT}" ]; then
            OFFICIAL_ENDPOINT=$(terraform output -raw api_gateway_endpoint 2>/dev/null || true)
          fi

          {
            echo "## Deploy Auth-Lambda"
            echo ""
            if [ -n "${OFFICIAL_ENDPOINT}" ]; then
              echo "- Endpoint oficial: ${OFFICIAL_ENDPOINT}"
              echo "- Health check sugerido: ${OFFICIAL_ENDPOINT%/}/healthz"
              echo "- Login oficial (POST): ${OFFICIAL_ENDPOINT%/}/auth/login"
              echo "- Observability check (logs): cpf, authResult, reason, latencyMs, correlationId"
              echo "- Observability check (metrics): auth_login_success_total, auth_login_failure_total{reason}, auth_token_issued_total"
            else
              echo "- Endpoint oficial: nao disponivel neste run (verifique etapas de plan/apply)."
              echo "- Login oficial esperado (POST): <api-gateway-endpoint>/auth/login"
              echo "- Observability check (metrics): validar no CloudWatch/New Relic apos obter endpoint."
            fi
          } >> "$GITHUB_STEP_SUMMARY"
